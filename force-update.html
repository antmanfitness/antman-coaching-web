<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="no" />
  <title>Updating Client Hub…</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #030404; color: #f5f5f5; font-family: -apple-system, system-ui, sans-serif; padding: 24px; text-align: center; }
    p { color: #a0a0a0; line-height: 1.4; }
    b { color: #ff4338; }
  </style>
</head>
<body>
  <div>
    <h1>Updating Client Hub…</h1>
    <p id="msg">Clearing the old saved copy so your home-screen app can load the new one.</p>
  </div>
  <script>
    (async function () {
      var msg = document.getElementById('msg')
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations()
          await Promise.all(regs.map(function (r) { return r.unregister() }))
        }
        if (window.caches) {
          var keys = await caches.keys()
          await Promise.all(keys.map(function (k) { return caches.delete(k) }))
        }
        try { localStorage.removeItem('antman-app-v') } catch (e) {}
        msg.innerHTML = 'Done. <b>Fully close</b> the home-screen Client Hub (swipe it away), then open it again.'
        setTimeout(function () {
          location.replace('./?_fresh=' + Date.now())
        }, 1800)
      } catch (e) {
        msg.textContent = 'Could not clear automatically. In Safari: Settings → Safari → Advanced → Website Data → remove antmanfitness.github.io, then reopen Client Hub.'
      }
    })()
  </script>
</body>
</html>
